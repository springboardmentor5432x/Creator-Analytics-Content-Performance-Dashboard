<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request a CreatorIQ password reset.">
    <title>Forgot Password | CreatorIQ</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/forgot-password.js" defer></script>
</head>
<body>
    <main class="page-shell">
        <header class="site-header">
            <a href="index.html" class="brand-logo" aria-label="CreatorIQ home">
                <span class="logo-mark" aria-hidden="true">C</span>
                <span>Creator<span class="brand-accent">IQ</span></span>
            </a>
            <a href="index.html" class="text-link">Back to login</a>
        </header>

        <section class="page-card narrow" aria-labelledby="reset-title">
            <div class="form-heading">
                <span class="eyebrow">ACCOUNT RECOVERY</span>
                <h1 class="page-title" id="reset-title">Forgot your password?</h1>
                <p class="page-description">
                    Enter your email address to request a password reset. We'll keep the process simple and secure.
                </p>
            </div>

            <div class="prototype-notice" role="note">
                <span aria-hidden="true">ⓘ</span>
                <span>Secure reset requests are enabled for local verification.</span>
            </div>

            <form id="reset-form" novalidate>
                <div class="form-group">
                    <label for="reset-email">Email address</label>
                    <input
                        type="email"
                        id="reset-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="254"
                        aria-describedby="reset-email-error"
                        required
                    >
                    <small class="field-error" id="reset-email-error" aria-live="polite"></small>
                </div>

                <div id="reset-status" class="form-status" role="status" aria-live="polite"></div>

                <button type="submit" class="btn btn-primary" id="reset-button">
                    <span class="button-text">Send Reset Link</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <p class="signup-prompt">
                Remember your password?
                <a href="index.html" class="text-link">Sign in</a>
            </p>
        </section>
    </main>
</body>
</html>
