function setupYouTubeIntegration() {
    const form = document.getElementById("youtube-connect-form");
    if (!form) return;

    const input = document.getElementById("youtube-identifier");
    const statusEl = document.getElementById("youtube-status");
    const button = document.getElementById("youtube-connect-btn");
    const savedIdentifier = sessionStorage.getItem("creatoriq_youtube_identifier");
    if (savedIdentifier) input.value = savedIdentifier;

    // Load the most recently saved channel automatically for this logged-in creator.
    // The backend filters by the current user's ID, so other creators' channels are not exposed.
    loadSavedYouTubeChannel();

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const identifier = input.value.trim();
        if (!identifier) return;

        button.disabled = true;
        button.textContent = "Fetching...";
        statusEl.textContent = "Fetching public channel and video metrics from YouTube...";

        try {
            const data = await apiGet(`/youtube/channel?identifier=${encodeURIComponent(identifier)}`);
            sessionStorage.setItem("creatoriq_youtube_identifier", identifier);
            await loadDashboard();
            renderYouTubeResult(data);
        } catch (error) {
            const currentStatus = document.getElementById("youtube-status");
            if (currentStatus) currentStatus.textContent = error.message;
            else showError(error.message);
        } finally {
            const currentButton = document.getElementById("youtube-connect-btn");
            if (currentButton) {
                currentButton.disabled = false;
                currentButton.textContent = "Fetch real data";
            }
        }
    });
}

async function loadSavedYouTubeChannel() {
    const statusEl = document.getElementById("youtube-status");
    try {
        const data = await apiGet("/youtube/my-channel");
        if (data && data.channel) {
            renderYouTubeResult(data);
            const input = document.getElementById("youtube-identifier");
            if (input && !input.value) input.value = data.channel.custom_url || data.channel.channel_id || "";
        } else if (statusEl) {
            statusEl.textContent = "No saved YouTube channel yet. Enter a channel ID or @handle and select Fetch real data.";
        }
    } catch (error) {
        if (statusEl) statusEl.textContent = `Saved channel could not be loaded: ${error.message}`;
    }
}

function renderYouTubeResult(data) {
    const channel = data.channel || {};
    const channelResult = document.getElementById("youtube-channel-result");
    const videoList = document.getElementById("youtube-video-list");
    const statusEl = document.getElementById("youtube-status");
    if (!channelResult || !videoList || !statusEl) return;

    channelResult.innerHTML = `
        <div class="platform-card" style="margin-top:10px;">
            <div class="platform-name">
                ${channel.thumbnail_url ? `<img src="${esc(channel.thumbnail_url)}" alt="" width="30" height="30" style="border-radius:7px;object-fit:cover">` : `<span class="platform-logo">Y</span>`}
                ${esc(channel.title || "YouTube channel")}
            </div>
            <div class="metric-foot">Channel ID: ${esc(channel.channel_id || "—")}</div>
            <div class="metric-foot">Subscribers: <strong>${channel.subscriber_count == null ? "Hidden by channel" : fmt(channel.subscriber_count)}</strong></div>
            <div class="metric-foot">Total views: <strong>${fmt(channel.view_count)}</strong></div>
            <div class="metric-foot">Videos: <strong>${fmt(channel.video_count)}</strong></div>
            <div class="metric-foot">Last synced: ${esc(new Date(channel.last_synced_at || Date.now()).toLocaleString())}</div>
        </div>`;

    const videos = Array.isArray(data.videos) ? data.videos : [];
    let showAllVideos = false;

    function renderVideoList() {
        const visibleVideos = showAllVideos ? videos : videos.slice(0, 5);
        const videoRows = visibleVideos.map(video => `
            <div class="youtube-video">
                ${video.thumbnail_url ? `<img src="${esc(video.thumbnail_url)}" alt="">` : `<div class="content-thumb">▶</div>`}
                <div>
                    <div class="youtube-video-title">${esc(video.title)}</div>
                    <div class="youtube-video-meta">${video.published_at ? esc(new Date(video.published_at).toLocaleDateString()) : "Publish date unavailable"}</div>
                    <div class="youtube-video-meta">Views ${fmt(video.views)} · Likes ${fmt(video.likes)} · Comments ${fmt(video.comments)}</div>
                </div>
                <div class="youtube-video-stats"><a href="https://www.youtube.com/watch?v=${encodeURIComponent(video.video_id)}" target="_blank" rel="noopener noreferrer">Open video ↗</a></div>
            </div>`).join("");

        const toggleButton = videos.length > 5
            ? `<div style="padding-top:10px;text-align:center">
                   <button type="button" class="btn btn-primary" id="toggle-youtube-videos">${showAllVideos ? "Show less" : `Show more`}</button>
               </div>`
            : "";

        videoList.innerHTML = videoRows
            ? videoRows + toggleButton
            : `<div class="chart-empty">No public videos were returned for this channel.</div>`;

        const toggle = document.getElementById("toggle-youtube-videos");
        if (toggle) {
            toggle.addEventListener("click", () => {
                showAllVideos = !showAllVideos;
                renderVideoList();
            });
        }
    }

    renderVideoList();
    statusEl.textContent = "YouTube data fetched and saved to the database. Public metrics can be delayed by YouTube.";
}

async function setupAudienceDemographics() {
    const ageEl = document.getElementById("ageDemographics");
    const genderEl = document.getElementById("genderDemographics");
    if (!ageEl || !genderEl) return;
    try {
        const result = await apiGet("/analytics/audience/demographics");
        const records = Array.isArray(result.records) ? result.records : [];
        if (!records.length) {
            const message = result.message || "No verified demographic data is available from the connected platform.";
            ageEl.textContent = message;
            genderEl.textContent = message;
            return;
        }
        const renderDimension = (type, el) => {
            const rows = records.filter(r => String(r.dimension_type || "").toLowerCase() === type);
            if (!rows.length) {
                el.textContent = `No verified ${type} demographic data is available.`;
                return;
            }
            el.innerHTML = rows.map(r => {
                const value = Math.max(0, Math.min(100, Number(r.percentage || 0)));
                return `<div class="demographic-row" style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:12px"><span>${esc(r.dimension_value || "Unknown")}</span><strong>${value.toFixed(1)}%</strong></div><div style="height:7px;background:#ece9ff;border-radius:8px;overflow:hidden;margin-top:5px"><div style="height:100%;width:${value}%;background:var(--primary,#6847f5);border-radius:8px"></div></div></div>`;
            }).join("");
        };
        renderDimension("age", ageEl);
        renderDimension("gender", genderEl);
    } catch (error) {
        ageEl.textContent = `Could not load verified age demographics: ${error.message}`;
        genderEl.textContent = `Could not load verified gender demographics: ${error.message}`;
    }
}

function setupPlatformSync() {
    const connectButtons = document.querySelectorAll("[data-connect-platform]");
    connectButtons.forEach(btn => {
        btn.addEventListener("click", async () => {
            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = "Opening Instagram...";
            try {
                // Let Instagram identify the account on its own login screen.
                // The OAuth state still binds the callback to this CreatorIQ user.
                const result = await apiGet("/auth/instagram/connect");
                if (!result.authorization_url) {
                    throw new Error("The backend did not return an Instagram authorization URL.");
                }
                window.location.href = result.authorization_url;
            } catch (error) {
                alert(`Could not start Instagram connection: ${error.message}`);
                btn.disabled = false;
                btn.textContent = originalText || "Connect Instagram";
            }
        });
    });

    const syncButtons = document.querySelectorAll("[data-sync-platform]");
    syncButtons.forEach(btn => {
        btn.addEventListener("click", async () => {
            const platform = btn.dataset.syncPlatform;
            let query = "";

            // X uses a Bearer Token for public profile lookup. Enter your own
            // handle for initial testing, e.g. @yourusername.
            if (platform === "x") {
                const handle = prompt("Enter the X username to look up (e.g. @yourusername):");
                if (!handle || !handle.trim()) return;
                query = `?username=${encodeURIComponent(handle.trim())}`;
            }

            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = "Syncing...";
            try {
                const res = await fetch(`${API_URL}/social/sync/${platform}${query}`, {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Authorization": `Bearer ${token}`
                    }
                });

                let data = {};
                try {
                    data = await res.json();
                } catch (_) {
                    data = {};
                }
                if (!res.ok) {
                    const detail = typeof data.detail === "string"
                        ? data.detail
                        : JSON.stringify(data.detail || data);
                    throw new Error(detail || `Sync failed (HTTP ${res.status})`);
                }

                let message = `${(data.platform || platform).toUpperCase()} synced successfully.\nFollowers: ${fmt(data.followers)}`;
                if (platform === "instagram") {
                    message += `\nPosts: ${fmt(data.media_count ?? data.posts ?? 0)}`;
                    message += `\nFollowers: ${data.followers == null ? "Not provided by this API response" : fmt(data.followers)}`;
                    if (data.username) message += `\nAccount: @${data.username}`;
                    if (data.recent_media && data.recent_media.length) {
                        message += `\nRecent posts returned: ${data.recent_media.length}`;
                    }
                    if (data.media_error) {
                        message += `\nNote: profile synced, but recent posts could not be loaded: ${data.media_error}`;
                    }
                    if (data.followers_error) {
                        message += `\nFollower count: ${data.followers_error}`;
                    }
                } else if (platform === "x") {
                    message += `\nPosts: ${fmt(data.posts ?? 0)}`;
                    if (data.username) message += `\nAccount: @${data.username}`;
                } else if (platform === "linkedin") {
                    message += "\nSource: configured LinkedIn organization page";
                }

                alert(message);
                await loadDashboard();
            } catch (err) {
                alert(`Error syncing ${platform}: ${err.message}\n\nCheck your API token, permissions, account ID, API access tier, and backend terminal for details.`);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText || "Sync Now";
            }
        });
    });
}

function setupCompareHandler() {
    const btn = document.getElementById("compareBtn");
    if (!btn) return;

    btn.addEventListener("click", async () => {
        const p1 = document.getElementById("compareSelect1").value;
        const p2 = document.getElementById("compareSelect2").value;
        const container = document.getElementById("comparisonResult");

        if (!p1 || !p2) {
            alert("Please select two posts to compare.");
            return;
        }
        if (p1 === p2) {
            alert("Please choose two different posts.");
            return;
        }

        container.innerHTML = `<div class="chart-empty">Comparing posts...</div>`;

        try {
            const res = await apiGet(`/analytics/content/compare?post_id_1=${encodeURIComponent(p1)}&post_id_2=${encodeURIComponent(p2)}`);
            const [a, b] = res.comparison;

            container.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Metric</th>
                                <th>${esc(a.title.substring(0, 24))}...</th>
                                <th>${esc(b.title.substring(0, 24))}...</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td><strong>Views</strong></td><td>${fmt(a.views)}</td><td>${fmt(b.views)}</td></tr>
                            <tr><td><strong>Likes</strong></td><td>${fmt(a.likes)}</td><td>${fmt(b.likes)}</td></tr>
                            <tr><td><strong>Comments</strong></td><td>${fmt(a.comments)}</td><td>${fmt(b.comments)}</td></tr>
                            <tr><td><strong>Engagement</strong></td><td>${fmt(a.engagement)}</td><td>${fmt(b.engagement)}</td></tr>
                            <tr><td><strong>Engagement Rate</strong></td><td>${a.engagement_rate}%</td><td>${b.engagement_rate}%</td></tr>
                        </tbody>
                    </table>
                </div>
            `;
        } catch (err) {
            container.innerHTML = `<div class="chart-empty" style="color:var(--red);">${esc(err.message)}</div>`;
        }
    });
}

async function campaignRequest(path, method = "GET", body = undefined) {
    let response;
    try {
        const options = {
            method,
            headers: { "Accept": "application/json", "Authorization": `Bearer ${token}` }
        };
        if (body !== undefined) {
            options.headers["Content-Type"] = "application/json";
            options.body = JSON.stringify(body);
        }
        response = await fetch(`${API_URL}${path}`, options);
    } catch (_) {
        throw new Error(`Cannot connect to ${API_URL}. Make sure FastAPI is running.`);
    }
    const raw = await response.text();
    let data = {};
    try { data = raw ? JSON.parse(raw) : {}; } catch (_) { data = { detail: raw }; }
    if (response.status === 401) {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(USER_KEY);
        window.location.replace("index.html");
        throw new Error("Your login session expired. Please sign in again.");
    }
    if (!response.ok) throw new Error(data.detail || `Campaign request failed (${response.status}).`);
    return data;
}

function setupCampaignManager() {
    const list = document.getElementById("campaign-list");
    if (!list) return;
    const form = document.getElementById("campaign-form");
    const message = document.getElementById("campaign-message");
    let editingId = null;
    let cachedCampaigns = [];

    function setMessage(text, isError = false) {
        if (!message) return;
        message.textContent = text;
        message.style.color = isError ? "var(--red)" : "var(--muted)";
    }
    function formPayload() {
        const name = document.getElementById("campaign-name").value.trim();
        const platform = document.getElementById("campaign-platform").value;
        const budgetText = document.getElementById("campaign-budget").value.trim();
        const startDate = document.getElementById("campaign-start").value;
        const endDate = document.getElementById("campaign-end").value;
        if (!name) throw new Error("Campaign name is required.");
        if (startDate && endDate && endDate < startDate) throw new Error("End date cannot be before start date.");
        return {
            name, platform,
            description: document.getElementById("campaign-description").value.trim(),
            budget: budgetText === "" ? null : Number(budgetText),
            status: document.getElementById("campaign-status").value,
            start_date: startDate || null,
            end_date: endDate || null
        };
    }
    function resetForm() {
        if (!form) return;
        form.reset();
        editingId = null;
        const save = document.getElementById("campaign-save");
        const cancel = document.getElementById("campaign-cancel");
        if (save) save.textContent = "Save campaign";
        if (cancel) cancel.hidden = true;
    }
    function renderCampaigns(items) {
        cachedCampaigns = items;
        if (!items.length) {
            list.className = "chart-empty";
            list.textContent = "No campaigns saved yet. Use the form above to create your first campaign.";
            return;
        }
        list.className = "table-wrap";
        list.innerHTML = `<table><thead><tr><th>Campaign</th><th>Platform</th><th>Budget</th><th>Status</th><th>Dates</th><th>Actions</th></tr></thead><tbody>${
            items.map(c => `<tr>
                <td><strong>${esc(c.name || "Untitled")}</strong><div class="person-sub">${esc(c.description || "")}</div></td>
                <td>${esc(c.platform || "—")}</td>
                <td>${c.budget == null ? "—" : esc(money(c.budget))}</td>
                <td>${status(c.status || "planning")}</td>
                <td>${esc(c.start_date || "—")} – ${esc(c.end_date || "—")}</td>
                <td><div class="campaign-table-actions">
                    <button type="button" class="btn btn-small" data-campaign-edit="${Number(c.campaign_id)}">Edit</button>
                    <button type="button" class="btn btn-small" data-campaign-delete="${Number(c.campaign_id)}">Delete</button>
                </div></td>
            </tr>`).join("")
        }</tbody></table>`;
    }
    async function loadCampaigns() {
        list.className = "chart-empty";
        list.textContent = "Loading campaigns…";
        try {
            const data = await campaignRequest("/campaigns");
            renderCampaigns(Array.isArray(data.campaigns) ? data.campaigns : []);
        } catch (error) {
            list.className = "chart-empty";
            list.textContent = error.message;
            setMessage(error.message, true);
        }
    }

    if (form) {
        form.addEventListener("submit", async event => {
            event.preventDefault();
            const save = document.getElementById("campaign-save");
            save.disabled = true;
            try {
                const payload = formPayload();
                const path = editingId === null ? "/campaigns" : `/campaigns/${editingId}`;
                const result = await campaignRequest(path, editingId === null ? "POST" : "PUT", payload);
                setMessage(result.message || (editingId === null ? "Campaign created." : "Campaign updated."));
                resetForm();
                await loadCampaigns();
            } catch (error) {
                setMessage(error.message, true);
            } finally {
                save.disabled = false;
            }
        });
        document.getElementById("campaign-cancel").addEventListener("click", () => {
            resetForm();
            setMessage("Edit cancelled.");
        });
    }

    list.addEventListener("click", async event => {
        const editButton = event.target.closest("[data-campaign-edit]");
        const deleteButton = event.target.closest("[data-campaign-delete]");
        if (editButton) {
            const item = cachedCampaigns.find(c => Number(c.campaign_id) === Number(editButton.dataset.campaignEdit));
            if (!item || !form) return;
            editingId = Number(item.campaign_id);
            document.getElementById("campaign-name").value = item.name || "";
            document.getElementById("campaign-platform").value = item.platform || "instagram";
            document.getElementById("campaign-budget").value = item.budget ?? "";
            document.getElementById("campaign-status").value = item.status || "planning";
            document.getElementById("campaign-start").value = item.start_date || "";
            document.getElementById("campaign-end").value = item.end_date || "";
            document.getElementById("campaign-description").value = item.description || "";
            document.getElementById("campaign-save").textContent = "Update campaign";
            document.getElementById("campaign-cancel").hidden = false;
            form.scrollIntoView({behavior:"smooth", block:"center"});
        } else if (deleteButton) {
            const id = Number(deleteButton.dataset.campaignDelete);
            const item = cachedCampaigns.find(c => Number(c.campaign_id) === id);
            if (!item || !window.confirm(`Delete campaign "${item.name || "Untitled"}"? This cannot be undone.`)) return;
            deleteButton.disabled = true;
            try {
                const result = await campaignRequest(`/campaigns/${id}`, "DELETE");
                setMessage(result.message || "Campaign deleted.");
                await loadCampaigns();
            } catch (error) {
                setMessage(error.message, true);
                deleteButton.disabled = false;
            }
        }
    });
    loadCampaigns();
}

function setupNavigation(config) {
    const nav = document.getElementById("navigation");
    nav.innerHTML = config.nav.map((item, i) => `
        <a href="#${item[0]}" data-target="${item[0]}" class="${i === 0 ? "active" : ""}">
            <span class="nav-icon">${item[1]}</span><span>${esc(item[2])}</span>
        </a>`).join("");

    nav.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", event => {
            event.preventDefault();
            const target = document.getElementById(link.dataset.target);
            if (!target) return;
            nav.querySelectorAll("a").forEach(a => a.classList.remove("active"));
            link.classList.add("active");
            target.scrollIntoView({behavior:"smooth", block:"start"});
        });
    });
}

function showError(message) {
    const box = document.getElementById("errorBox");
    box.textContent = message;
    box.style.display = "block";
}

async function loadDashboard() {
    const btn = document.getElementById("refreshBtn");
    btn.disabled = true;
    btn.textContent = "Loading...";
    document.getElementById("errorBox").style.display = "none";

    if (!token) {
        window.location.replace("index.html");
        return;
    }

    try {
        const profileResponse = await apiGet("/me");
        const user = profileResponse.user || profileResponse;
        const role = normalizeRole(user.role);

        if (!role || !ROLE_CONFIG[role]) {
            throw new Error("Your account role is missing or unsupported.");
        }

        const [analyticsResponse, growthResponse] = await Promise.all([
            apiGet("/dashboard/analytics"),
            apiGet("/dashboard/growth")
        ]);

        const analytics = {
            total_followers: Number(analyticsResponse.total_followers || 0),
            platforms: analyticsResponse.platforms || {}
        };
        const growth = Array.isArray(growthResponse.growth) ? growthResponse.growth : [];

        sessionStorage.setItem(USER_KEY, JSON.stringify({...user, role}));

        const config = ROLE_CONFIG[role];
        document.getElementById("pageTitle").textContent = config.title;
        document.getElementById("eyebrow").textContent = config.eyebrow;
        document.getElementById("pageSubtitle").textContent = config.subtitle;
        document.getElementById("workspaceLabel").textContent = config.title;
        document.getElementById("accountName").textContent = user.name || user.full_name || user.email || "User";
        document.getElementById("accountRole").textContent = role.replace(/_/g, " ");
        document.getElementById("avatar").textContent = String(user.name || user.email || "U").charAt(0).toUpperCase();

        setupNavigation(config);

        if (role === "creator") {
            let contentData = { total_posts: 0, metrics: {}, top_by_views: [], posts_list: [] };
            let instagramData = { connected: false, account: null, posts: [] };
            try {
                contentData = await apiGet("/analytics/content/overview");
            } catch (_) {}
            try {
                instagramData = await apiGet("/social/instagram/overview");
            } catch (error) {
                instagramData = { connected: false, account: null, posts: [], error: error.message };
            }

            document.getElementById("dashboardContent").innerHTML = creatorDashboard(user, analytics, growth, contentData, config, instagramData);
            setupYouTubeIntegration();
            setupPublicAccountSearch();
            setupPlatformSync();
            setupAudienceDemographics();
            setupCompareHandler();
        } else {
            const roleData = await apiGet("/dashboard/role-data");
            if (role === "agency") {
                const agency = await apiGet("/agency/workspace");
                roleData.agency_workspace = agency;
                roleData.creators = agency.creators || [];
                roleData.total_creators = roleData.creators.length;
                roleData.total_followers = roleData.creators.reduce((a,c)=>a+Number(c.followers||0),0);
                roleData.total_views = roleData.creators.reduce((a,c)=>a+Number(c.views||0),0);
                roleData.total_likes = roleData.creators.reduce((a,c)=>a+Number(c.likes||0),0);
                roleData.total_videos = roleData.creators.reduce((a,c)=>a+Number(c.videos||0),0);
            }
            if (role === "admin") roleData.admin_workspace = await apiGet("/admin/workspace");
            const renderers = {
                agency: agencyDashboard,
                marketing_team: marketingDashboard,
                admin: adminDashboard
            };
            document.getElementById("dashboardContent").innerHTML = renderers[role](user, analytics, growth, config, roleData);
        }
        if (role === "agency") {
            setupAgencyForms();
            setupAgencyContentLibrary();
        }
        if (role === "marketing_team") {
            setupCampaignManager();
            setupLocalWorkspaceRecords();
            setupCampaignReporting();
        }

    } catch (error) {
        showError(error.message);
        document.getElementById("dashboardContent").innerHTML = `
            <section class="panel">
                <h3>Unable to load dashboard</h3>
                <p class="panel-sub">Check that FastAPI is running on port 8000, the database is available, and your session is valid.</p>
                <button class="btn btn-primary" id="retryBtn">Try again</button>
            </section>`;
        document.getElementById("retryBtn").addEventListener("click", loadDashboard);
    } finally {
        btn.disabled = false;
        btn.textContent = "Refresh data";
    }
}

document.getElementById("refreshBtn").addEventListener("click", loadDashboard);
document.getElementById("refreshIcon").addEventListener("click", loadDashboard);

document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem(USER_KEY);
    window.location.replace("index.html");
});

document.getElementById("dateRange").addEventListener("change", () => {
    const selected = document.getElementById("dateRange").value;
    if (selected !== "30") {
        showError("The date-range selector is visual only. Date-filtered analytics require backend support.");
    } else {
        document.getElementById("errorBox").style.display = "none";
    }
});

loadDashboard();
</script>
