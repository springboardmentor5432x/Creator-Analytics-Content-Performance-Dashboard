<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreatorIQ Dashboard</title>

<style>
:root {
    --primary: #6847f5;
    --primary-dark: #5030d5;
    --primary-light: #eee9ff;
    --primary-soft: #f7f4ff;
    --background: #f5f6fc;
    --surface: #ffffff;
    --text: #191936;
    --muted: #777b98;
    --border: #e7e8f3;
    --green: #12a875;
    --red: #e65369;
    --orange: #e9a23b;
    --blue: #4e91f5;
    --shadow: 0 3px 14px rgba(39, 35, 91, .035);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    font-size: 13px;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }

.app { display: flex; min-height: 100vh; }

.sidebar {
    width: 235px;
    flex-shrink: 0;
    padding: 23px 14px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}
.logo {
    margin: 0 9px 6px;
    font-size: 24px;
    font-weight: 850;
    letter-spacing: -.8px;
    color: var(--primary);
}
.logo span { color: var(--text); }
.logo-caption {
    color: var(--muted);
    margin: 0 9px 27px;
    font-size: 11px;
}
.workspace-label {
    margin: 0 10px 10px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}
.nav { display: grid; gap: 5px; }
.nav a {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 12px;
    border-radius: 9px;
    color: #626580;
    text-decoration: none;
    font-size: 12px;
    transition: background .15s, color .15s;
}
.nav a:hover, .nav a.active {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-weight: 750;
}
.nav-icon {
    width: 19px;
    font-size: 16px;
    text-align: center;
}
.sidebar-bottom { margin-top: auto; padding-top: 22px; }
.account {
    display: flex;
    gap: 10px;
    align-items: center;
    border-top: 1px solid var(--border);
    padding: 16px 5px 13px;
}
.avatar {
    width: 37px;
    height: 37px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    border-radius: 12px;
    color: var(--primary);
    background: var(--primary-light);
    font-weight: 800;
}
.account-info { min-width: 0; }
.account-name {
    font-size: 12px;
    font-weight: 750;
    overflow-wrap: anywhere;
}
.account-role { margin-top: 4px; font-size: 11px; color: var(--muted); }
.logout {
    width: 100%;
    border: 1px solid var(--border);
    background: white;
    border-radius: 9px;
    padding: 11px;
    color: var(--text);
}
.logout:hover { background: var(--primary-light); color: var(--primary-dark); }

.main { flex: 1; min-width: 0; padding: 24px 26px; }
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 21px;
}
.eyebrow {
    color: var(--primary);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 7px;
}
h1 { margin: 0; font-size: 26px; letter-spacing: -.6px; }
.subtitle { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.top-actions { display: flex; align-items: center; gap: 9px; }
.select-date, .btn {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 11px;
}
.btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    font-weight: 750;
}
.btn-primary:hover { background: var(--primary-dark); }
.icon-btn {
    width: 37px;
    height: 37px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: white;
    color: var(--primary);
    font-size: 16px;
}
.error {
    display: none;
    padding: 13px;
    margin-bottom: 16px;
    border-radius: 9px;
    color: #a52338;
    background: #ffeaed;
    line-height: 1.6;
    overflow-wrap: anywhere;
}
.notice {
    background: var(--primary-soft);
    border: 1px solid #e3dcff;
    border-radius: 10px;
    color: #5743a4;
    font-size: 11px;
    line-height: 1.7;
    padding: 12px 14px;
    margin-bottom: 16px;
}
.welcome {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    background: linear-gradient(110deg, var(--primary-light), #fff 90%);
    border: 1px solid #e3dcff;
    padding: 19px 21px;
    border-radius: 13px;
    margin-bottom: 17px;
}
.welcome h2 { margin: 0 0 7px; font-size: 18px; }
.welcome p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
.pill {
    display: inline-block;
    white-space: nowrap;
    border-radius: 20px;
    padding: 6px 9px;
    color: var(--primary-dark);
    background: white;
    font-size: 10px;
    font-weight: 750;
}
.metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 17px;
}
.metrics.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.metric {
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    min-width: 0;
    box-shadow: var(--shadow);
}
.metric-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 7px;
    margin-bottom: 14px;
}
.metric-title { color: var(--muted); font-size: 11px; line-height: 1.5; }
.metric-icon {
    width: 31px;
    height: 31px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    border-radius: 9px;
    color: var(--primary);
    background: var(--primary-light);
    font-size: 15px;
}
.metric-value { font-size: clamp(18px, 1.7vw, 25px); font-weight: 850; overflow-wrap: anywhere; letter-spacing: -.5px; }
.metric-foot { margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.5; }
.positive { color: var(--green); }
.muted { color: var(--muted); }
.grid-main {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(250px, 1fr);
    gap: 14px;
    margin-bottom: 15px;
}
.grid-half {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 15px;
}
.grid-thirds {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 15px;
}
.panel {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 17px;
    box-shadow: var(--shadow);
}
.panel-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 15px;
}
.panel h3 { margin: 0; font-size: 13px; font-weight: 800; }
.panel-sub { color: var(--muted); font-size: 10px; margin-top: 5px; line-height: 1.6; }
.badge {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 20px;
    color: var(--primary-dark);
    background: var(--primary-light);
    font-size: 10px;
    font-weight: 750;
    white-space: nowrap;
}
.chart { width: 100%; height: 215px; display: block; }
.chart-empty {
    min-height: 160px;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.8;
    padding: 15px;
}
.legend { display: flex; gap: 13px; flex-wrap: wrap; font-size: 10px; color: var(--muted); margin-bottom: 8px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.donut-wrap { display: flex; align-items: center; gap: 15px; min-height: 155px; }
.donut {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    background: conic-gradient(var(--primary) 0 42%, #9079fa 42% 70%, #b8a8ff 70% 82%, #d3c9ff 82% 92%, #e9e3ff 92% 100%);
}
.donut:after {
    content: "";
    position: absolute;
    inset: 27px;
    border-radius: 50%;
    background: white;
}
.donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 1;
    font-weight: 850;
    font-size: 16px;
}
.donut-center small { margin-top: 4px; color: var(--muted); font-weight: 400; font-size: 9px; }
.donut-legend { display: grid; gap: 11px; min-width: 0; flex: 1; }
.legend-row { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; }
.legend-label { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; }
.legend-color { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
.bars { display: grid; gap: 15px; }
.bar-item { min-width: 0; }
.bar-top { display: flex; justify-content: space-between; gap: 9px; margin-bottom: 7px; font-size: 11px; }
.bar-top span:first-child { color: var(--muted); }
.bar-track { height: 8px; background: #efedf9; border-radius: 20px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--primary); border-radius: 20px; }
.platform-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.platform-card { border: 1px solid var(--border); padding: 12px; border-radius: 10px; min-width: 0; }
.platform-name { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; margin-bottom: 12px; }
.platform-logo {
    width: 25px;
    height: 25px;
    display: grid;
    place-items: center;
    border-radius: 7px;
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 850;
}
.platform-count { font-size: 18px; font-weight: 850; overflow-wrap: anywhere; }
.platform-note { margin-top: 6px; color: var(--muted); font-size: 9px; line-height: 1.5; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
th {
    text-align: left;
    padding: 11px 9px;
    background: #f8f7ff;
    color: #74728e;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .3px;
    font-weight: 800;
}
td { padding: 11px 9px; border-bottom: 1px solid #efeff7; }
tbody tr:last-child td { border-bottom: 0; }
.person { display: flex; align-items: center; gap: 8px; }
.person-avatar {
    width: 29px;
    height: 29px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    color: var(--primary);
    background: var(--primary-light);
    font-weight: 850;
}
.person-name { font-weight: 750; font-size: 11px; }
.person-sub { color: var(--muted); font-size: 9px; margin-top: 3px; }
.status {
    display: inline-block;
    border-radius: 20px;
    padding: 5px 8px;
    background: #e5f8ef;
    color: #087b52;
    font-size: 9px;
    font-weight: 750;
}
.status.pending { background: #fff4df; color: #98630b; }
.status.inactive { background: #ffe9ed; color: #bb3049; }
.activity-list { display: grid; gap: 15px; }
.activity { display: flex; gap: 9px; align-items: flex-start; }
.activity-icon {
    width: 31px;
    height: 31px;
    border-radius: 9px;
    background: var(--primary-light);
    color: var(--primary);
    display: grid;
    place-items: center;
    flex-shrink: 0;
}
.activity-main { flex: 1; min-width: 0; }
.activity-title { font-size: 11px; font-weight: 750; line-height: 1.5; }
.activity-desc { font-size: 10px; color: var(--muted); line-height: 1.6; margin-top: 3px; }
.activity-time { font-size: 9px; color: var(--muted); margin-top: 4px; }
.tag { color: var(--primary-dark); background: var(--primary-light); border-radius: 6px; padding: 4px 6px; font-size: 9px; font-weight: 750; }
.content-thumb {
    width: 43px;
    height: 35px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 16px;
}
.content-title { font-size: 10px; font-weight: 750; }
.content-meta { color: var(--muted); font-size: 9px; margin-top: 4px; }
.inline-actions { display: flex; gap: 7px; flex-wrap: wrap; }
.section-anchor { scroll-margin-top: 18px; }
.youtube-connect-form { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.youtube-connect-form input { flex:1; min-width:210px; padding:10px 11px; border:1px solid var(--border); border-radius:8px; }
.youtube-status { color:var(--muted); font-size:11px; line-height:1.6; margin:8px 0; overflow-wrap:anywhere; }
.youtube-video-list { display:grid; gap:9px; }
.youtube-video { display:grid; grid-template-columns:56px minmax(0,1fr) auto; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.youtube-video img { width:56px; height:40px; object-fit:cover; border-radius:6px; background:var(--primary-light); }
.youtube-video-title { font-weight:700; font-size:11px; white-space:normal; line-height:1.5; }
.youtube-video-meta { color:var(--muted); font-size:10px; margin-top:3px; }
.youtube-video-stats { color:var(--muted); font-size:10px; text-align:right; white-space:normal; }
@media(max-width:600px) { .youtube-video { grid-template-columns:48px minmax(0,1fr); } .youtube-video-stats { grid-column:2; text-align:left; } }
.footer { text-align: center; padding: 24px 0 8px; font-size: 10px; color: var(--muted); }

@media(max-width:1200px) {
    .sidebar { width: 210px; }
    .main { padding: 20px; }
    .metrics.five { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-thirds { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media(max-width:850px) {
    .grid-main, .grid-half { grid-template-columns: minmax(0, 1fr); }
    .metrics, .metrics.five { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .topbar { align-items: flex-start; flex-direction: column; }
    .top-actions { width: 100%; flex-wrap: wrap; }
}
@media(max-width:650px) {
    .app { display: block; }
    .sidebar { width: 100%; padding: 15px; }
    .logo { margin-bottom: 4px; }
    .logo-caption { margin-bottom: 15px; }
    .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sidebar-bottom { padding-top: 10px; }
    .main { padding: 15px 12px; }
    h1 { font-size: 23px; }
    .welcome { align-items: flex-start; flex-direction: column; }
    .grid-thirds { grid-template-columns: minmax(0, 1fr); }
    .metrics, .metrics.five { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric { padding: 12px; }
    .metric-value { font-size: 19px; }
    .panel { padding: 13px; }
    .donut-wrap { flex-wrap: wrap; }
}

.campaign-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.campaign-form label { display:grid; gap:5px; color:var(--muted); font-size:10px; font-weight:700; }
.campaign-form input,.campaign-form select,.campaign-form textarea { width:100%; min-width:0; padding:10px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text); }
.campaign-form textarea { min-height:75px; resize:vertical; grid-column:1/-1; }
.campaign-form .wide { grid-column:1/-1; }
.campaign-actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:11px; }
.campaign-table-actions { display:flex; gap:6px; }
.btn-small { padding:6px 8px; font-size:10px; }
@media(max-width:650px) { .campaign-form { grid-template-columns:1fr; } .campaign-form textarea,.campaign-form .wide { grid-column:auto; } }


.table-tools { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 10px; }
.table-tools input { flex:1; min-width:150px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; }
.table-tools select { padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:#fff; }
.local-record-form { margin-bottom:10px; }
.local-record-form label { min-width:0; }

   CREATORIQ VISUAL REFRESH
   Styling-only layer: preserves existing markup, routes and JS.
   ============================================================ */
:root {
    --primary: #6755e8;
    --primary-dark: #4f3acb;
    --primary-light: #f0edff;
    --primary-soft: #f8f6ff;
    --background: #f6f7fb;
    --surface: #ffffff;
    --text: #1b2038;
    --muted: #737b93;
    --border: #e8eaf2;
    --shadow: 0 8px 24px rgba(28, 34, 67, .055);
}
html {
    scroll-behavior: smooth;
    scroll-padding-top: 18px;
}
body {
    background: var(--background);
    color: var(--text);
    line-height: 1.5;
    overflow-x: hidden;
}

    min-width: 0;
    min-height: 100vh;
}
.sidebar {

    position: sticky;
    top: 0;
    height: 100vh;
    max-height: 100vh;
    overflow-y: auto;
    z-index: 5;
}

    margin: 0 10px 5px;

}

    margin: 0 10px 31px;

}
.workspace-label {
    margin: 0 11px 11px;
    color: #9298ad;
    letter-spacing: 1.35px;
}
.nav {
    gap: 6px;
}
.nav a {
    min-height: 42px;
    padding: 11px 13px;
    border: 1px solid transparent;
    border-radius: 11px;
    color: #68708a;
    font-size: 12px;
    font-weight: 550;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
}

    background: linear-gradient(100deg, #f0edff, #f8f7ff);
    border-color: #e6e1ff;
    color: var(--primary-dark);
    font-weight: 750;
    box-shadow: inset 3px 0 0 var(--primary);
}
.nav-icon {
    width: 20px;
    color: var(--primary);
}
.sidebar-bottom {
    padding-top: 20px;
}
.account {
    padding: 17px 6px 14px;
}
.avatar {
    width: 39px;

    border-radius: 13px;
}
.logout {
    border-radius: 10px;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
}
.logout:hover {
    border-color: #ded8ff;
}
.main {
    min-width: 0;
    width: 100%;
    padding: 29px clamp(20px, 2.6vw, 38px) 34px;
    overflow-x: hidden;
}
.topbar {
    margin-bottom: 23px;
}

    font-size: 28px;
    letter-spacing: -.8px;
    line-height: 1.2;
}

    font-size: 12px;
    max-width: 720px;
}
.top-actions {
    gap: 10px;
}
.select-date, .btn {
    min-height: 38px;
    border-radius: 10px;
    border-color: #e5e7f0;
    padding: 10px 13px;
    font-size: 11px;
    transition: background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.btn:hover, .select-date:hover {
    border-color: #d8d2ff;
    box-shadow: 0 4px 12px rgba(74, 59, 170, .07);
}
.btn:active {
    transform: translateY(1px);
}
.btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 5px 12px rgba(103, 85, 232, .16);
}
.btn-primary:hover {
    background: var(--primary-dark);
    border-color: var(--primary-dark);
}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid rgba(103, 85, 232, .24);
    outline-offset: 2px;
}
.icon-btn {
    border-radius: 11px;
}
.error {
    border: 1px solid #ffd5dd;
    border-radius: 12px;
}
.notice {
    border-radius: 12px;
    padding: 13px 16px;
}
.welcome {
    min-height: 112px;
    padding: 23px 25px;
    border-radius: 17px;
    border-color: #e4dfff;
    background: linear-gradient(112deg, #eeeaff 0%, #f8f6ff 55%, #fff 100%);
    box-shadow: 0 8px 22px rgba(69, 54, 151, .045);
    margin-bottom: 19px;
}
.welcome h2 {
    font-size: 20px;
    letter-spacing: -.35px;
}
.welcome p {
    max-width: 760px;
    font-size: 12px;
}
.pill {
    padding: 7px 11px;
    border: 1px solid #e8e3ff;
    border-radius: 20px;
    box-shadow: 0 2px 7px rgba(59, 49, 120, .04);
}
.metrics {
    gap: 14px;
    margin-bottom: 19px;
}
.metric {
    padding: 18px 18px 17px;
    border-radius: 15px;
    border-color: #e9eaf2;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.metric:hover {
    transform: translateY(-2px);
    border-color: #ded8ff;
    box-shadow: 0 12px 26px rgba(40, 43, 82, .075);
}
.metric-head {
    margin-bottom: 16px;
}
.metric-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08px;
}
.metric-icon {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    background: linear-gradient(145deg, #f0edff, #e9e4ff);
}
.metric-value {
    font-size: clamp(21px, 1.85vw, 27px);
    letter-spacing: -.65px;
    line-height: 1.2;
}
.metric-foot {
    margin-top: 9px;
    font-size: 10px;
}
.grid-main, .grid-half, .grid-thirds {
    gap: 17px;
    margin-bottom: 17px;
}
.grid-main > *, .grid-half > *, .grid-thirds > * {
    min-width: 0;
}
.panel {
    padding: 19px;
    border-radius: 16px;
    border-color: #e9eaf2;
    box-shadow: var(--shadow);
    min-width: 0;
}
.panel-head {
    align-items: center;
    margin-bottom: 17px;
}
.panel h3 {
    font-size: 14px;
    letter-spacing: -.15px;
}
.panel-sub {
    font-size: 10px;
    color: #858ca2;
}
.badge {
    padding: 6px 9px;
    border-radius: 9px;
    font-size: 10px;
}
.chart {
    width: 100%;
    max-width: 100%;
    height: 235px;
}
.chart-empty {
    border: 1px dashed #e4e5ef;
    border-radius: 12px;
    background: #fbfbfe;
    min-height: 135px;
}
.donut-wrap {
    gap: 20px;
    min-height: 180px;
}
.donut {
    width: 142px;
    height: 142px;
    box-shadow: 0 5px 16px rgba(60, 52, 130, .08);
}
.donut:after {
    inset: 30px;
    background: #fff;
}
.donut-center {
    font-size: 18px;
    letter-spacing: -.3px;
}
.donut-center small {
    font-size: 10px;
}
.donut-legend {
    gap: 13px;
}
.legend-row {
    align-items: center;
    font-size: 11px;
}
.legend-label {
    font-size: 11px;
}
.legend-color {
    width: 9px;
    height: 9px;
}
.platform-grid {
    gap: 11px;
}
.platform-card {
    padding: 14px;
    border-radius: 13px;
    border-color: #e9eaf2;
    background: linear-gradient(160deg, #fff 70%, #fbfaff 100%);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.platform-card:hover {
    transform: translateY(-2px);
    border-color: #ded8ff;
    box-shadow: 0 9px 19px rgba(49, 45, 105, .06);
}
.platform-name {
    gap: 9px;
    font-size: 12px;
    margin-bottom: 13px;
}
.platform-logo {
    width: 29px;
    height: 29px;
    border-radius: 9px;
    font-size: 12px;
}
.platform-count {
    font-size: 22px;
    letter-spacing: -.45px;
}
.platform-note {
    font-size: 10px;
}
.table-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
}
table {
    font-size: 11px;
}
th {
    padding: 12px 11px;
    background: #f7f6fc;
    letter-spacing: .55px;
}
td {
    padding: 12px 11px;
}
tbody tr:hover {
    background: #fbfaff;
}
.status {
    padding: 5px 9px;
}
.person-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
}
.activity-list {
    gap: 17px;
}
.activity-icon {
    border-radius: 10px;
}
.youtube-connect-form {
    gap: 9px;
    margin: 14px 0;
}
.youtube-connect-form input {
    min-height: 39px;
    border-radius: 10px;
    border-color: #e5e7f0;
    background: #fff;
}
.youtube-status {
    font-size: 11px;
}
.youtube-video-list {
    gap: 5px;
}
.youtube-video {
    grid-template-columns: 68px minmax(0, 1fr) auto;
    gap: 12px;
    padding: 12px 9px;
    border-radius: 11px;
    border-bottom-color: #eff0f6;
    transition: background .16s ease;
}
.youtube-video:hover {
    background: #fbfaff;
}
.youtube-video img {
    width: 68px;
    height: 49px;
    border-radius: 9px;
}
.youtube-video-title {
    font-size: 12px;
}
.youtube-video-meta {
    font-size: 10px;
    line-height: 1.45;
}
.content-thumb {
    width: 48px;
    height: 40px;
    border-radius: 9px;
}
.footer {
    padding: 28px 0 12px;
}

/* Tablet layout */
@media(max-width:1100px) {
    .sidebar {
        width: 220px;
    }
    .main {
        padding: 22px 20px 28px;
    }
    .metrics {
        gap: 11px;
    }
    .metric {
        padding: 15px;
    }
    .grid-main, .grid-half, .grid-thirds {
        gap: 13px;
    }
}

/* Compact devices */
@media(max-width:850px) {
    .app {
        display: block;
    }
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        max-height: none;
        overflow: visible;
        padding: 16px 18px 12px;
    }
    .logo-caption {
        margin-bottom: 17px;
    }
    .nav {
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 6px;
    }
    .sidebar-bottom {
        padding-top: 10px;
    }
    .account {
        padding-top: 11px;
    }
    .main {
        padding: 20px 18px 28px;
    }
    .grid-main, .grid-half, .grid-thirds {
        grid-template-columns: minmax(0, 1fr);
    }
    .topbar {
        flex-direction: row;
        align-items: center;
    }
    .donut-wrap {
        justify-content: flex-start;
    }
}

/* Phone layout */
@media(max-width:650px) {
    .sidebar {
        padding: 14px 13px 10px;
    }
    .logo {
        font-size: 22px;
    }
    .nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .nav a {
        min-height: 40px;
        padding: 9px 10px;
        font-size: 11px;
    }
    .main {
        padding: 16px 12px 24px;
    }
    .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }
    h1 {
        font-size: 23px;
    }
    .top-actions {
        width: 100%;
    }
    .welcome {
        padding: 18px;
        border-radius: 15px;
    }
    .welcome h2 {
        font-size: 18px;
    }
    .metrics, .metrics.five {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
    }
    .metric {
        padding: 13px;
        border-radius: 13px;
    }
    .metric-value {
        font-size: 20px;
    }
    .grid-main, .grid-half, .grid-thirds {
        gap: 11px;
        margin-bottom: 12px;
    }
    .panel {
        padding: 15px;
        border-radius: 14px;
    }
    .chart {
        height: 205px;
    }
    .donut-wrap {
        gap: 15px;
        justify-content: center;
    }
    .donut {
        width: 125px;
        height: 125px;
    }
    .donut:after {
        inset: 26px;
    }
    .donut-legend {
        min-width: 150px;
    }
    .platform-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .youtube-video {
        grid-template-columns: 54px minmax(0, 1fr);
        gap: 9px;
        padding: 10px 5px;
    }
    .youtube-video img {
        width: 54px;
        height: 42px;
    }
    .youtube-video-stats {
        grid-column: 2;
        text-align: left;
    }
}
@media(max-width:390px) {
    .metrics, .metrics.five, .platform-grid {
        grid-template-columns: minmax(0, 1fr);
    }
    .nav {
        grid-template-columns: minmax(0, 1fr);
    }
    .donut-wrap {
        flex-direction: column;
    }
    .donut-legend {
        width: 100%;
    }
}


/* Zoom-safe layout for the post comparison controls. */
.compare-controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(88px, auto);
    align-items: stretch;
    gap: 8px;
    width: 100%;
    min-width: 0;
    margin-bottom: 12px;
}
.compare-controls > * {
    min-width: 0;
    max-width: 100%;
}
.compare-controls .compare-select {
    width: 100%;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
}
.compare-controls .compare-button {
    width: auto;
    min-width: 88px;
    min-height: 38px;
    margin: 0;
    padding: 8px 12px;
    white-space: normal;
    line-height: 1.25;
}
@media(max-width: 1100px) {
    .compare-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .compare-controls .compare-button {
        grid-column: 1 / -1;
        width: 100%;
    }
}
@media(max-width: 560px) {
    .compare-controls {
        grid-template-columns: minmax(0, 1fr);
    }
    .compare-controls .compare-button {
        grid-column: auto;
    }
}


/* Fill unused dashboard grid columns across every role. */
.grid-main > :only-child,
.grid-half > :only-child,
.grid-thirds > :only-child {
    grid-column: 1 / -1;
    width: 100%;
    min-width: 0;
}
.grid-half > :last-child:nth-child(odd) {
    grid-column: 1 / -1;
}
.grid-thirds > :last-child:nth-child(3n + 1) {
    grid-column: 1 / -1;
}


/* Compact summary metrics inside report panels (Admin, Agency, Marketing). */
.panel .metrics {
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 118px), 1fr));
    gap: 10px;
}
.panel .metrics .metric {
    min-width: 0;
    padding: 13px 10px;
}
.panel .metrics .metric-head {
    gap: 5px;
    margin-bottom: 11px;
}
.panel .metrics .metric-title {
    min-width: 0;
    line-height: 1.35;
}
.panel .metrics .metric-icon {
    width: 29px;
    height: 29px;
    flex: 0 0 29px;
}
.panel .metrics .metric-value {
    font-size: clamp(12px, 1.15vw, 17px);
    line-height: 1.2;
    letter-spacing: -.35px;
    white-space: nowrap;
    overflow-wrap: normal;
    word-break: normal;
}
.panel .metrics .metric-foot {
    line-height: 1.4;
}
.content-library-actions {
    display: flex;
    justify-content: center;
    margin-top: 12px;
}
.content-library-toggle {
    width: auto;
    min-width: 105px;
    min-height: 34px;
    margin: 0;
    padding: 7px 15px;
    border-radius: 9px;
    font-size: 11px;
}
@media(max-width: 520px) {
    .panel .metrics {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 105px), 1fr));
    }
}

</style>

<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">▰ <span>CreatorIQ</span></div>
        <div class="logo-caption">Creator intelligence platform</div>
        <div class="workspace-label" id="workspaceLabel">Workspace</div>
        <nav class="nav" id="navigation"></nav>

        <div class="sidebar-bottom">
            <div class="account">
                <div class="avatar" id="avatar">U</div>
                <div class="account-info">
                    <div class="account-name" id="accountName">Loading...</div>
                    <div class="account-role" id="accountRole">Account</div>
                </div>
            </div>
            <button class="logout" id="logoutBtn">↪ &nbsp; Log out</button>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <div class="eyebrow" id="eyebrow">Workspace overview</div>
                <h1 id="pageTitle">Loading dashboard...</h1>
                <div class="subtitle" id="pageSubtitle">Verifying your account...</div>
            </div>
            <div class="top-actions">
                <select class="select-date" id="dateRange" aria-label="Dashboard date range">
                    <option value="30">▦ Last 30 Days</option>
                    <option value="7">Last 7 Days</option>
                    <option value="90">Last 90 Days</option>
                </select>
                <button class="icon-btn" type="button" title="Refresh dashboard" id="refreshIcon">↻</button>
                <button class="btn btn-primary" type="button" id="refreshBtn">Refresh data</button>
            </div>
        </header>

        <div class="error" id="errorBox" role="alert"></div>
        <div id="dashboardContent">
            <div class="panel">Loading your dashboard...</div>
        </div>
        <div class="footer">CreatorIQ · Your data, your growth, your decisions</div>
    </main>
</div>

<script>
"use strict";

const API_URL = "https://my-creatoriq.onrender.com";
const TOKEN_KEY = "creatoriq_token";
const USER_KEY = "creatoriq_user";
const token = sessionStorage.getItem(TOKEN_KEY);

const COLORS = ["#6847f5", "#9079fa", "#b8a8ff", "#d3c9ff", "#e9e3ff"];

const PLATFORM_NAMES = {
    instagram: "Instagram",
    youtube: "YouTube",
    x: "X (Twitter)",
    linkedin: "LinkedIn"
};

/* Preserved all original sub-routes exactly as shown in your video */
const ROLE_CONFIG = {
    creator: {
        title: "Creator Dashboard",
        eyebrow: "Creator studio",
        subtitle: "Track your content performance, audience insights and grow your personal brand.",
        greeting: "Your creative journey, all in one place.",
        nav: [
            ["overview", "⌂", "Dashboard"],
            ["content", "▣", "My Content"],
            ["analytics", "▥", "Analytics"],
            ["social", "◎", "Social Accounts"],
            ["public-account-search", "⌕", "Public Account Search"],
            ["audience", "♙", "Audience"],
            ["earnings", "▤", "Earnings"],
            ["brands", "◇", "Brand Deals"],
            ["activity", "⚙", "Settings"]
        ]
    },
    agency: {
        title: "Agency Dashboard",
        eyebrow: "Agency workspace",
        subtitle: "Manage multiple creators, track campaign performance and compare results across your roster.",
        greeting: "Your agency performance, at a glance.",
        nav: [
            ["overview", "⌂", "Dashboard"],
            ["creators", "♙", "Creators"],
            ["campaigns", "▣", "Campaigns"],
            ["analytics", "▥", "Analytics"],
            ["content", "▤", "Content Library"],
            ["team", "♧", "Team Members"],
            ["reports", "▧", "Reports"],
            ["billing", "₹", "Billing"]
        ]
    },
    marketing_team: {
        title: "Marketing Team Dashboard",
        eyebrow: "Marketing workspace",
        subtitle: "Plan and manage campaigns, track performance and analyze content impact.",
        greeting: "Turn campaign data into better decisions.",
        nav: [
            ["overview", "⌂", "Dashboard"],
            ["campaigns", "▣", "Campaigns"],
            ["planning", "▤", "Content Planning"],
            ["analytics", "▥", "Analytics"],
            ["influencers", "♙", "Influencers"],
            ["reports", "▧", "Reports"],
            ["assets", "▧", "Brand Assets"],
            ["tasks", "✓", "Task Management"]
        ]
    },
    admin: {
        title: "Admin Dashboard",
        eyebrow: "Platform administration",
        subtitle: "Manage users, monitor platform usage and oversee system performance.",
        greeting: "Your CreatorIQ administration center.",
        nav: [
            ["overview", "⌂", "Dashboard"],
            ["users", "♙", "User Management"],
            ["creators", "◎", "Creators"],
            ["agencies", "♧", "Agencies"],
            ["marketing", "▣", "Marketing Teams"],
            ["integrations", "◇", "Platform Integrations"],
            ["monitoring", "◉", "Content Monitoring"],
            ["analytics", "▥", "Analytics Overview"],
            ["reports", "▧", "Reports"],
            ["settings", "⚙", "System Settings"],
            ["activity", "◷", "Activity Logs"]
        ]
    }
};

function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
    })[c]);
}

function normalizeRole(value) {
    const role = String(value || "").trim().toLowerCase()
        .replace(/[\s-]+/g, "_");

    const aliases = {
        creator: "creator",
        agency: "agency",
        admin: "admin",
        administrator: "admin",
        system_admin: "admin",
        marketing: "marketing_team",
        marketing_team: "marketing_team"
    };
    return aliases[role] || null;
}

function fmt(value) {
    return Number(value || 0).toLocaleString("en-IN");
}

function money(value) {
    return "₹" + Number(value || 0).toLocaleString("en-IN");
}

function pct(value) {
    return `${Number(value || 0).toFixed(1)}%`;
}

async function apiGet(path) {
    let response;

    try {
        response = await fetch(`${API_URL}${path}`, {
            headers: {
                "Accept": "application/json",
                "Authorization": `Bearer ${token}`
            }
        });
    } catch {
        throw new Error(`Cannot connect to ${API_URL}. Start FastAPI and try again.`);
    }

    const raw = await response.text();
    let data = {};
    try { data = raw ? JSON.parse(raw) : {}; }
    catch { data = {detail: raw}; }

    if (response.status === 401 || response.status === 403) {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(USER_KEY);
        window.location.replace("index.html");
        throw new Error("Your login session has expired.");
    }

    if (!response.ok) {
        throw new Error(data.detail || `API request failed: ${response.status}`);
    }
    return data;
}

function metric(title, value, icon, foot) {
    return `<div class="metric">
        <div class="metric-head">
            <div class="metric-title">${esc(title)}</div>
            <div class="metric-icon">${icon}</div>
        </div>
        <div class="metric-value">${esc(value)}</div>
        <div class="metric-foot">${esc(foot)}</div>
    </div>`;
}

function metrics(items, five = false) {
    return `<section class="metrics ${five ? "five" : ""}">${items.join("")}</section>`;
}

function panel(title, body, subtitle = "", badge = "") {
    return `<section class="panel">
        <div class="panel-head">
            <div>
                <h3>${esc(title)}</h3>
                ${subtitle ? `<div class="panel-sub">${esc(subtitle)}</div>` : ""}
            </div>
            ${badge ? `<span class="badge">${esc(badge)}</span>` : ""}
        </div>
        ${body}
    </section>`;
}

function welcome(user, config) {
    const name = user.name || user.full_name || user.email || "User";
    return `<section class="welcome section-anchor" id="overview">
        <div>
            <h2>Welcome back, ${esc(name)} 👋</h2>
            <p>${esc(config.greeting)} ${esc(config.subtitle)}</p>
        </div>
        <span class="pill">${esc(config.title)}</span>
    </section>`;
}

function status(value) {
    const key = String(value).toLowerCase();
    const cls = ["inactive", "paused", "blocked"].includes(key)
        ? "inactive"
        : ["pending", "planning", "scheduled"].includes(key)
            ? "pending" : "";
    return `<span class="status ${cls}">${esc(value)}</span>`;
}

function person(name, sub) {
    return `<div class="person">
        <div class="person-avatar">${esc(String(name).charAt(0).toUpperCase())}</div>
        <div><div class="person-name">${esc(name)}</div>
        <div class="person-sub">${esc(sub)}</div></div>
    </div>`;
}

function table(headers, rows) {
    if (!rows.length) return `<div class="chart-empty">No records available yet.</div>`;
    return `<div class="table-wrap"><table>
        <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
}

function activity(items) {
    return `<div class="activity-list">${items.map((item, i) => `
        <div class="activity">
            <div class="activity-icon">${["↗", "◎", "▣", "✓", "♙"][i % 5]}</div>
            <div class="activity-main">
                <div class="activity-title">${esc(item.title)}</div>
                <div class="activity-desc">${esc(item.description)}</div>
                ${item.time ? `<div class="activity-time">${esc(item.time)}</div>` : ""}
            </div>
        </div>`).join("")}</div>`;
}

function bars(items) {
    return `<div class="bars">${items.map(item => `
        <div class="bar-item">
            <div class="bar-top"><span>${esc(item.label)}</span><strong>${esc(item.value || item.percent + "%")}</strong></div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0, Math.min(100, Number(item.percent) || 0))}%"></div></div>
        </div>`).join("")}</div>`;
}

function donut(items, centerValue, centerLabel) {
    // A missing platform snapshot is not the same as zero followers.
    const knownItems = items.filter(item =>
        item.value !== null &&
        item.value !== undefined &&
        Number.isFinite(Number(item.value)) &&
        Number(item.value) >= 0
    );
    const total = knownItems.reduce((sum, item) => sum + Number(item.value), 0);
    let cumulative = 0;
    const stops = total > 0 ? knownItems
        .filter(item => Number(item.value) > 0)
        .map(item => {
            const start = cumulative;
            cumulative += Number(item.value) / total * 100;
            const color = COLORS[items.indexOf(item) % COLORS.length];
            return `${color} ${start}% ${cumulative}%`;
        }).join(", ") : "";

    const legend = items.map((item, i) => {
        const hasSnapshot = item.value !== null &&
            item.value !== undefined &&
            Number.isFinite(Number(item.value)) &&
            Number(item.value) >= 0;
        const reading = !hasSnapshot
            ? "Not synced"
            : total > 0
                ? `${Math.round(Number(item.value) / total * 100)}%`
                : "0%";
        return `
            <div class="legend-row">
                <span class="legend-label">
                    <span class="legend-color" style="background:${COLORS[i % COLORS.length]}"></span>
                    ${esc(item.label)}
                </span>
                <strong>${reading}</strong>
            </div>`;
    }).join("");

    const hasAnySnapshot = knownItems.length > 0;
    return `<div class="donut-wrap">
        <div class="donut" style="background:conic-gradient(${stops || "#e9e3ff 0 100%"})">

function lineChart(series, labels, options = {}) {
    const all = series.flatMap(s => s.values.map(Number));
    if (!all.length) return `<div class="chart-empty">No chart data available.</div>`;

    const width = 620, height = 230;
    const left = 49, right = 15, top = 15, bottom = 32;
    const plotW = width - left - right, plotH = height - top - bottom;
    const min = Math.min(0, ...all);
    const max = Math.max(1, ...all);
    const range = Math.max(max - min, 1);
    let svg = `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(options.label || "Analytics chart")}">`;

    for (let i = 0; i <= 4; i++) {
        const y = top + plotH * i / 4;
        const value = max - (max - min) * i / 4;
        svg += `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}" stroke="#eceaf6"/>
        <text x="${left - 8}" y="${y + 4}" font-size="10" text-anchor="end" fill="#777b98">${fmt(value)}</text>`;
    }

    const x = i => left + (labels.length <= 1 ? plotW / 2 : plotW * i / (labels.length - 1));
    const y = value => top + plotH * (1 - (Number(value) - min) / range);

    series.forEach((s, si) => {
        const color = COLORS[si % COLORS.length];
        const points = s.values.map((value, i) => `${x(i)},${y(value)}`).join(" ");
        if (si === 0 && series.length === 1) {
            const firstX = x(0);
            const lastX = x(s.values.length - 1);
            svg += `<polygon points="${firstX},${top + plotH} ${points} ${lastX},${top + plotH}" fill="${color}" opacity=".09"/>`;
        }
        svg += `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
        s.values.forEach((value, i) => {
            svg += `<circle cx="${x(i)}" cy="${y(value)}" r="3" fill="${color}"><title>${esc(s.name)}: ${fmt(value)}</title></circle>`;
        });
    });

    labels.forEach((label, i) => {
        if (labels.length <= 7 || i % Math.ceil(labels.length / 7) === 0 || i === labels.length - 1) {
            svg += `<text x="${x(i)}" y="${height - 9}" font-size="10" text-anchor="middle" fill="#777b98">${esc(label)}</text>`;
        }
    });
    return svg + "</svg>";
}

function legendSeries(series) {
    return `<div class="legend">${series.map((s, i) => `
        <span class="legend-item"><span class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></span>${esc(s.name)}</span>

}

function setupAgencyContentLibrary() {
    const container = document.getElementById("agency-content-library");
    const toggle = document.getElementById("agency-content-toggle");
    if (!container || !toggle) return;

    const extraRows = Array.from(
        container.querySelectorAll("[data-agency-content-extra]")
    );
    if (!extraRows.length) return;

    toggle.addEventListener("click", () => {
        const expanded = toggle.getAttribute("aria-expanded") === "true";
        extraRows.forEach(row => { row.hidden = expanded; });
        toggle.setAttribute("aria-expanded", String(!expanded));
        toggle.textContent = expanded ? "Show more" : "Show less";
    });
}


function setupAgencyForms() {

/* Editable workspace lists. These are browser-local until matching backend tables/endpoints are added. */
function localRecordsPanel(key, buttonLabel, fields, headers) {
    const formId = `local-form-${key}`;
    const listId = `local-list-${key}`;
    const inputs = fields.map(field => {
        let control;
        if (field.type === "select") {
            control = `<select name="${esc(field.id)}" ${field.required ? "required" : ""}>${(field.options || []).map(option => `<option value="${esc(option)}">${esc(option)}</option>`).join("")}</select>`;
        } else {
            control = `<input name="${esc(field.id)}" type="${esc(field.type || "text")}" placeholder="${esc(field.placeholder || "")}" ${field.required ? "required" : ""} ${field.type === "number" ? 'min="0"' : ""}>`;
        }
        return `<label>${esc(field.label)}${control}</label>`;
    }).join("");
    return `<form class="campaign-form local-record-form" id="${formId}" data-local-key="${esc(key)}">${inputs}
        <div class="campaign-actions wide"><button class="btn btn-primary" type="submit">${esc(buttonLabel)}</button></div>
        </form><div class="youtube-status" id="local-message-${esc(key)}"></div>
        <div class="table-wrap" id="${listId}" data-local-table="${esc(key)}"></div>`;
}

function setupLocalWorkspaceRecords() {
    const definitions = {
        plans: {fields:["title","platform","date","status"], labels:["Content idea","Platform","Publish date","Status"]},
        tasks: {fields:["title","owner","due","status"], labels:["Task","Owner","Due date","Status"]},
        influencers: {fields:["name","platform","followers","status"], labels:["Name / handle","Platform","Followers","Status"]},
        assets: {fields:["name","url","type"], labels:["Asset name","URL","Type"]}
    };
    const storageKey = key => `creatoriq_workspace_${key}_${(JSON.parse(sessionStorage.getItem(USER_KEY) || "{}").email || "user")}`;
    function read(key) {
        try { const value = JSON.parse(localStorage.getItem(storageKey(key)) || "[]"); return Array.isArray(value) ? value : []; }
        catch (_) { return []; }
    }
    function write(key, items) { localStorage.setItem(storageKey(key), JSON.stringify(items)); }
    function render(key) {
        const target = document.querySelector(`[data-local-table="${key}"]`);
        if (!target) return;
        const def = definitions[key], items = read(key);
        if (!items.length) {
            target.innerHTML = `<div class="chart-empty">No records yet. Use the form above to add the first record.</div>`;
            return;
        }
        target.innerHTML = `<table><thead><tr>${def.labels.map(h => `<th>${esc(h)}</th>`).join("")}<th>Action</th></tr></thead><tbody>${items.map((item, index) =>
            `<tr>${def.fields.map(field => `<td>${field === "url" && item[field] ? `<a href="${esc(item[field])}" target="_blank" rel="noopener noreferrer">Open link ↗</a>` : esc(item[field] || "—")}</td>`).join("")}<td><button type="button" class="btn btn-small" data-local-delete="${index}" data-local-key="${key}">Delete</button></td></tr>`
        ).join("")}</tbody></table>`;
    }
    Object.keys(definitions).forEach(key => {
        const form = document.getElementById(`local-form-${key}`);
        if (!form) return;
        render(key);
        form.addEventListener("submit", event => {
            event.preventDefault();
            const item = {};
            new FormData(form).forEach((value, field) => item[field] = String(value).trim());
            const items = read(key);
            items.unshift({...item, created_at:new Date().toISOString()});
            write(key, items);
            form.reset();
            const message = document.getElementById(`local-message-${key}`);
            if (message) message.textContent = "Saved in this browser.";
            render(key);
        });
        const target = document.querySelector(`[data-local-table="${key}"]`);
        target.addEventListener("click", event => {
            const button = event.target.closest("[data-local-delete]");
            if (!button) return;
            const items = read(key);
            items.splice(Number(button.dataset.localDelete), 1);
            write(key, items);
            render(key);
        });
    });
}

async function setupCampaignReporting() {

function setupPublicAccountSearch() {
    const form = document.getElementById("public-search-form");
    if (!form) return;
    const platform = document.getElementById("public-search-platform");
    const identifier = document.getElementById("public-search-identifier");
    const button = document.getElementById("public-search-btn");
    const statusEl = document.getElementById("public-search-status");
    const resultsEl = document.getElementById("public-search-results");

    const updateSearchHint = () => {
        if (!identifier) return;
        const instagramSelected = platform.value === "instagram";
        identifier.placeholder = instagramSelected
            ? "Business Discovery unavailable with Instagram Login"
            : "Public channel ID, @handle, or profile URL";
        button.disabled = instagramSelected;
        statusEl.textContent = instagramSelected
            ? "This CreatorIQ connection uses Instagram Login. Meta Business Discovery requires Facebook Login, so public Instagram account search is unavailable. You can still connect and sync your own Instagram account."
            : "Search public accounts where official APIs allow it. Results do not change your own follower history.";
        if (instagramSelected) resultsEl.innerHTML = "";
    };
    platform.addEventListener("change", updateSearchHint);
    updateSearchHint();

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (platform.value === "instagram") {
            updateSearchHint();
            return;
        }
        const accountIdentifier = identifier.value.trim();
        if (!accountIdentifier) return;
        button.disabled = true;
        button.textContent = "Searching...";
        statusEl.textContent = `Requesting public ${platform.value.toUpperCase()} metrics from the official API...`;
        resultsEl.innerHTML = "";
        try {
            const result = await apiGet(`/public-search?platform=${encodeURIComponent(platform.value)}&identifier=${encodeURIComponent(accountIdentifier)}`);
            renderPublicAccountSearch(result);
            statusEl.textContent = `${result.source || "Official API"} · Results include only fields returned by the platform.`;
        } catch (error) {
            statusEl.textContent = error.message;
        } finally {
            button.disabled = platform.value === "instagram";
            button.textContent = "Search account";
        }
    });
}
