services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creatoriq
      POSTGRES_USER: creatoriq
      POSTGRES_PASSWORD: creatoriq_local_only
    volumes:
      - creatoriq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatoriq -d creatoriq"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://creatoriq:creatoriq_local_only@db:5432/creatoriq
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-before-deployment}
      CORS_ORIGINS: http://localhost:4173,http://localhost:5173
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  creatoriq_pgdata:
